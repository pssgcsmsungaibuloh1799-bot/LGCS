<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Pengesahan Yuran Silat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-4 flex items-center justify-center">

  <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6 space-y-6">
    <div class="bg-emerald-800 p-4 -m-6 mb-2 text-white rounded-t-2xl flex justify-between items-center">
      <h1 class="font-bold text-base"><i class="fa-solid fa-user-shield"></i> Dashboard Admin Yuran</h1>
      <button onclick="loadPendingData()" class="text-xs bg-emerald-700 hover:bg-emerald-600 px-3 py-1.5 rounded font-semibold transition"><i class="fa-solid fa-rotate"></i> Muat Semula</button>
    </div>

    <!-- Login Admin -->
    <div id="admin-login-box" class="space-y-3 text-center py-4">
      <p class="text-xs font-semibold text-gray-600">Masukkan Kata Laluan Admin Untuk Akses:</p>
      <input type="password" id="admin-pass" class="border rounded-lg p-2.5 text-sm w-full max-w-xs text-center outline-none focus:ring-2 focus:ring-emerald-500" placeholder="••••••••">
      <div>
        <button onclick="loadPendingData()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-6 py-2 rounded-lg text-sm transition">Masuk</button>
      </div>
    </div>

    <!-- Senarai Menunggu Pengesahan -->
    <div id="pending-list" class="space-y-3 hidden"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygEDJl0iNtckmLwnXIvP50z9c-U_nQcIpDE2u7Opi40hzFisWBKWwx5geVl41ZfRi8/exec"; // Masukkan URL Web App Apps Script anda di sini

    async function loadPendingData() {
      const pass = document.getElementById('admin-pass').value.trim();
      if (!pass) return alert("Sila masukkan kata laluan admin!");

      const container = document.getElementById('pending-list');
      container.classList.remove('hidden');
      container.innerHTML = `<p class="text-center text-xs text-gray-500 py-4"><i class="fa-solid fa-spinner fa-spin"></i> Memuatkan rekod bayaran...</p>`;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=getAdminData&password=${encodeURIComponent(pass)}`);
        const result = await res.json();

        if (result.status === "SUCCESS") {
          document.getElementById('admin-login-box').classList.add('hidden');
          renderData(result.data);
        } else {
          alert(result.message);
          container.classList.add('hidden');
        }
      } catch (err) {
        alert("Ralat sambungan ke server!");
      }
    }

    function renderData(list) {
      const container = document.getElementById('pending-list');
      if (!list || list.length === 0) {
        container.innerHTML = `<div class="p-4 bg-gray-50 text-gray-500 text-xs rounded-xl text-center">Tiada bayaran baharu yang menunggu pengesahan.</div>`;
        return;
      }

      let html = '';
      list.forEach(item => {
        html += `
          <div class="border rounded-xl p-4 bg-gray-50 space-y-3 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded">MENUNGGU SEMAKAN</span>
                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded">${item.gelanggang}</span>
              </div>
              <h3 class="font-bold text-sm text-gray-800">${item.namaPesilat}</h3>
              <p class="text-xs text-gray-500">Pembayar: <strong>${item.namaPembayar}</strong></p>
              <p class="text-xs text-gray-600"><i class="fa-solid fa-calendar"></i> Bulan: <strong>${item.bulan}</strong></p>
              <p class="text-xs font-bold text-emerald-700"><i class="fa-solid fa-money-bill"></i> Jumlah: RM ${parseFloat(item.jumlah).toFixed(2)}</p>
            </div>

            <div class="flex items-center gap-2 w-full md:w-auto">
              <a href="${item.buktiUrl}" target="_blank" class="flex-1 md:flex-none text-center bg-gray-200 hover:bg-gray-300 text-gray-800 text-xs font-bold py-2 px-3 rounded-lg">
                <i class="fa-solid fa-image"></i> Resit Bank
              </a>
              <button onclick='approvePayment(${JSON.stringify(item)})' class="flex-1 md:flex-none bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold py-2 px-3 rounded-lg shadow">
                <i class="fa-solid fa-check"></i> Sahkan Bayaran
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    async function approvePayment(item) {
      if (!confirm(`Sahkan pembayaran RM ${item.jumlah} untuk ${item.namaPesilat}?`)) return;

      // Menentukan Tab Pesilat yang betul berdasarkan Gelanggang
      let targetSheetName = "SenariPesilatBBSB";
      if (item.gelanggang && item.gelanggang.toUpperCase().includes("AZALEA")) {
        targetSheetName = "SenaraiPesilatAzalea";
      }

      try {
        const payload = {
          action: "approvePayment",
          pRow: item.pRow,
          targetSheet: targetSheetName,
          bulan: item.bulan,
          jumlah: item.jumlah,
          namaPesilat: item.namaPesilat
        };

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.status === "SUCCESS") {
          alert("Bayaran berjaya disahkan!");
          loadPendingData();
        } else {
          alert("Gagal: " + result.message);
        }
      } catch (err) {
        alert("Ralat semasa mengesahkan bayaran!");
      }
    }
  </script>
</body>
</html>
