<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Tetapan Yuran Silat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 flex items-center justify-center">

  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl p-4 md:p-6 space-y-6">
    <!-- Header Utama (Bersih tanpa button Muat Semula) -->
    <div class="bg-emerald-800 p-4 -m-4 md:-m-6 mb-2 text-white rounded-t-2xl">
      <h1 class="font-bold text-sm md:text-base"><i class="fa-solid fa-user-shield"></i> Dashboard Admin Yuran</h1>
    </div>

    <!-- Login Admin -->
    <div id="admin-login-box" class="space-y-3 text-center py-4">
      <p class="text-xs font-semibold text-gray-600">Masukkan Kata Laluan Admin Untuk Akses:</p>
      <input type="password" id="admin-pass" onkeypress="if(event.key==='Enter') loadPendingData()" class="border rounded-lg p-2.5 text-sm w-full max-w-xs text-center outline-none focus:ring-2 focus:ring-emerald-500" placeholder="••••••••">
      <div>
        <button onclick="loadPendingData()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-6 py-2 rounded-lg text-sm transition shadow-md">Masuk</button>
      </div>
    </div>

    <!-- Kandungan Utama Dashboard -->
    <div id="admin-content" class="space-y-6 hidden">
      
      <!-- KOTAK TETAPAN HARGA YURAN -->
      <div class="border rounded-xl bg-slate-50 border-slate-200 overflow-hidden transition-all">
        
        <!-- Header Kotak Tetapan (Tekan Ikon Kanan Untuk Collapse) -->
        <div onclick="toggleRateSection()" class="p-4 bg-slate-100 flex justify-between items-center cursor-pointer hover:bg-slate-200 transition select-none">
          <h2 class="font-bold text-sm text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-sliders text-emerald-700"></i> Tetapan Kadar Harga Yuran
          </h2>
          <button id="btn-toggle-rate" aria-label="Lipat/Buka Tetapan Yuran" class="text-xs bg-white text-gray-700 w-8 h-8 rounded-lg border shadow-sm font-semibold flex items-center justify-center hover:bg-emerald-50 transition">
            <i id="icon-toggle-rate" class="fa-solid fa-chevron-down text-emerald-700"></i>
          </button>
        </div>

        <!-- Badan Kotak Tetapan -->
        <div id="rate-section-body" class="p-4 space-y-4 hidden border-t border-slate-200">
          
          <!-- Dropdown Gelanggang & Tahun -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end bg-white p-3 rounded-lg border">
            <div>
              <label class="block text-gray-600 text-xs font-semibold mb-1">Gelanggang</label>
              <select id="select-gelanggang" class="border rounded-lg p-2 text-xs w-full outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="BBSB">BBSB</option>
                <option value="AZALEA">Azalea</option>
              </select>
            </div>

            <div>
              <label class="block text-gray-600 text-xs font-semibold mb-1">Tahun</label>
              <select id="select-tahun" onchange="togglePendaftaranField()" class="border rounded-lg p-2 text-xs w-full outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="2026">2026</option>
                <option value="2025">2025</option>
              </select>
            </div>

            <div>
              <button onclick="fetchSpecificRates()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2 rounded-lg text-xs transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-magnifying-glass"></i> <span>SEMAK</span>
              </button>
            </div>
          </div>

          <!-- Borang Input Yuran Lengkap -->
          <div id="rate-form-container" class="bg-white p-4 rounded-lg border space-y-4 hidden">
            <h3 class="font-bold text-xs text-emerald-800 border-b pb-2 flex justify-between items-center">
              <span>Senarai Kadar Yuran (<span id="label-gelanggang"></span> - <span id="label-tahun"></span>)</span>
              <span class="text-[10px] text-gray-500 font-normal">*Kemaskini nombor dan tekan Simpan Yuran</span>
            </h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-xs">
              
              <!-- Pendaftaran (Disorok jika Tahun 2025) -->
              <div id="box-pendaftaran">
                <label class="block text-gray-600 mb-1 font-semibold">Pendaftaran (RM)</label>
                <input type="number" id="input-pendaftaran" class="border rounded p-2 w-full font-bold text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0">
              </div>

              <!-- Tahunan -->
              <div>
                <label class="block text-gray-600 mb-1 font-semibold">Tahunan (RM)</label>
                <input type="number" id="input-tahunan" class="border rounded p-2 w-full font-bold text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0">
              </div>

              <!-- Bulan Jan - Dis -->
              <div><label class="block text-gray-600 mb-1">Januari (RM)</label><input type="number" id="input-januari" class="border rounded p-2 w-full text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0"></div>
              <div><label class="block text-gray-600 mb-1">Februari (RM)</label><input type="number" id="input-februari" class="border rounded p-2 w-full text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0"></div>
              <div><label class="block text-gray-600 mb-1">Mac (RM)</label><input type="number" id="input-mac" class="border rounded p-2 w-full text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0"></div>
              <div><label class="block text-gray-600 mb-1">April (RM)</label><input type="number" id="input-april" class="border rounded p-2 w-full text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0"></div>
              <div><label class="block text-gray-600 mb-1">Mei (RM)</label><input type="number" id="input-mei" class="border rounded p-2 w-full text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0"></div>
              <div><label class="block text-gray-600 mb-1">Jun (RM)</label><input type="number" id="input-jun" class="border rounded p-2 w-full text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0"></div>
              <div><label class="block text-gray-600 mb-1">Julai (RM)</label><input type="number" id="input-julai" class="border rounded p-2 w-full text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0"></div>
              <div><label class="block text-gray-600 mb-1">Ogos (RM)</label><input type="number" id="input-ogos" class="border rounded p-2 w-full text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0"></div>
              <div><label class="block text-gray-600 mb-1">September (RM)</label><input type="number" id="input-september" class="border rounded p-2 w-full text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0"></div>
              <div><label class="block text-gray-600 mb-1">Oktober (RM)</label><input type="number" id="input-oktober" class="border rounded p-2 w-full text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0"></div>
              <div><label class="block text-gray-600 mb-1">November (RM)</label><input type="number" id="input-november" class="border rounded p-2 w-full text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0"></div>
              <div><label class="block text-gray-600 mb-1">Disember (RM)</label><input type="number" id="input-disember" class="border rounded p-2 w-full text-gray-700 outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0"></div>

            </div>

            <button onclick="submitNewRates()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold py-2.5 rounded-lg transition shadow flex items-center justify-center gap-1">
              <i class="fa-solid fa-floppy-disk"></i> <span>SIMPAN YURAN</span>
            </button>
          </div>

        </div>
      </div>

      <!-- SENARAI MENUNGGU PENGESAHAN (DENGAN BUTTON MUAT SEMULA DI SINI) -->
      <div>
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-sm text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left text-amber-600"></i> Senarai Menunggu Pengesahan
          </h2>
          <button onclick="loadPendingData()" class="text-xs bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-rotate"></i> <span>Muat Semula</span>
          </button>
        </div>
        <div id="pending-list" class="space-y-3"></div>
      </div>

    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzKR0CVSX9xZs_ueASiwtHxrTLE4i76TinP66KJpUzXqtCNOBNrl_eMyhNlWLvQjvFS/exec";
    let cachedPendingList = [];

    const listBulan = [
      "januari", "februari", "mac", "april", "mei", "jun",
      "julai", "ogos", "september", "oktober", "november", "disember"
    ];

    function toggleRateSection() {
      const bodyEl = document.getElementById('rate-section-body');
      const iconEl = document.getElementById('icon-toggle-rate');

      if (bodyEl.classList.contains('hidden')) {
        bodyEl.classList.remove('hidden');
        iconEl.className = 'fa-solid fa-chevron-up text-emerald-700';
      } else {
        bodyEl.classList.add('hidden');
        iconEl.className = 'fa-solid fa-chevron-down text-emerald-700';
      }
    }

    function togglePendaftaranField() {
      const tahun = document.getElementById('select-tahun').value;
      const boxPend = document.getElementById('box-pendaftaran');
      if (tahun === "2025") {
        boxPend.classList.add('hidden');
      } else {
        boxPend.classList.remove('hidden');
      }
    }

    async function loadPendingData() {
      const pass = document.getElementById('admin-pass').value.trim();
      if (!pass) return alert("Sila masukkan kata laluan admin!");

      const container = document.getElementById('pending-list');
      document.getElementById('admin-content').classList.remove('hidden');
      container.innerHTML = `<p class="text-center text-xs text-gray-500 py-6"><i class="fa-solid fa-spinner fa-spin text-lg block mb-2 text-emerald-700"></i> Memuatkan rekod bayaran...</p>`;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=getAdminData&password=${encodeURIComponent(pass)}`);
        const result = await res.json();

        if (result.status === "SUCCESS") {
          document.getElementById('admin-login-box').classList.add('hidden');
          cachedPendingList = result.data || [];
          renderData(cachedPendingList);
        } else {
          alert(result.message || "Kata laluan salah!");
          document.getElementById('admin-content').classList.add('hidden');
        }
      } catch (err) {
        alert("Ralat sambungan ke server!");
        document.getElementById('admin-content').classList.add('hidden');
      }
    }

    async function fetchSpecificRates() {
      const gelanggang = document.getElementById('select-gelanggang').value;
      const tahun = document.getElementById('select-tahun').value;
      const pass = document.getElementById('admin-pass').value.trim();

      togglePendaftaranField();

      try {
        const res = await fetch(`${SCRIPT_URL}?action=getRatesByFilter&gelanggang=${gelanggang}&tahun=${tahun}&password=${encodeURIComponent(pass)}`);
        const result = await res.json();

        if (result.status === "SUCCESS") {
          const rates = result.rates || {};
          
          document.getElementById('label-gelanggang').innerText = gelanggang;
          document.getElementById('label-tahun').innerText = tahun;

          document.getElementById('input-pendaftaran').value = rates.pendaftaran || 0;
          document.getElementById('input-tahunan').value = rates.tahunan || 0;

          listBulan.forEach(b => {
            const inputEl = document.getElementById(`input-${b}`);
            if (inputEl) inputEl.value = rates[b] || 0;
          });

          document.getElementById('rate-form-container').classList.remove('hidden');
        } else {
          alert(result.message || "Gagal mengambil data yuran!");
        }
      } catch (err) {
        alert("Ralat sambungan semasa mengambil data kadar yuran!");
      }
    }

    async function submitNewRates() {
      const gelanggang = document.getElementById('select-gelanggang').value;
      const tahun = document.getElementById('select-tahun').value;

      let payloadRates = {
        pendaftaran: parseFloat(document.getElementById('input-pendaftaran').value) || 0,
        tahunan: parseFloat(document.getElementById('input-tahunan').value) || 0
      };

      listBulan.forEach(b => {
        payloadRates[b] = parseFloat(document.getElementById(`input-${b}`).value) || 0;
      });

      if (!confirm(`Simpan KESELURUHAN kadar yuran bagi ${gelanggang} (${tahun})?`)) return;

      try {
        const payload = {
          action: "updateFullRatesFiltered",
          gelanggang: gelanggang,
          tahun: tahun,
          rates: payloadRates
        };

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.status === "SUCCESS") {
          alert("Semua kadar yuran berjaya dikemaskini dalam Google Sheet!");
        } else {
          alert("Gagal: " + result.message);
        }
      } catch (err) {
        alert("Ralat semasa menyimpan kadar yuran!");
      }
    }

    function renderData(list) {
      const container = document.getElementById('pending-list');
      if (!list || list.length === 0) {
        container.innerHTML = `
          <div class="p-6 bg-gray-50 text-gray-500 text-xs rounded-xl text-center border border-dashed border-gray-300">
            <i class="fa-solid fa-circle-check text-green-500 text-xl mb-1 block"></i>
            Tiada bayaran baharu yang menunggu pengesahan saat ini.
          </div>`;
        return;
      }

      let html = '';
      list.forEach((item, index) => {
        const amountFormatted = parseFloat(item.jumlah || 0).toFixed(2);
        html += `
          <div class="border rounded-xl p-3.5 md:p-4 bg-gray-50 space-y-3 hover:bg-white hover:shadow-sm transition">
            <div class="space-y-1">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase">MENUNGGU SEMAKAN</span>
                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase">${item.gelanggang || 'GELANGGANG'}</span>
              </div>
              <h3 class="font-bold text-sm text-gray-800 mt-1">${item.namaPesilat}</h3>
              <p class="text-xs text-gray-500"><i class="fa-solid fa-user-pen"></i> Pembayar: <strong>${item.namaPembayar}</strong></p>
              <p class="text-xs text-gray-600"><i class="fa-solid fa-calendar-check"></i> Item / Bulan: <strong class="text-gray-800">${item.bulan}</strong></p>
              <p class="text-xs font-bold text-emerald-700"><i class="fa-solid fa-money-bill-wave"></i> Jumlah: RM ${amountFormatted}</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-2 border-t border-gray-200">
              <a href="${item.buktiUrl}" target="_blank" class="w-full text-center bg-gray-200 hover:bg-gray-300 text-gray-800 text-xs font-bold py-2 px-2 rounded-lg transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-image"></i> Resit Bank
              </a>

              <button id="btn-reject-${index}" onclick="rejectPaymentByIndex(${index})" class="w-full bg-red-100 hover:bg-red-200 text-red-700 text-xs font-bold py-2 px-2 rounded-lg transition flex items-center justify-center gap-1 border border-red-300">
                <i class="fa-solid fa-xmark"></i> <span>Tolak / Batal</span>
              </button>

              <button id="btn-approve-${index}" onclick="approvePaymentByIndex(${index})" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold py-2 px-2 rounded-lg shadow transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-check"></i> <span>Sahkan</span>
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    async function approvePaymentByIndex(index) {
      const item = cachedPendingList[index];
      if (!item) return;

      const amountFormatted = parseFloat(item.jumlah || 0).toFixed(2);
      if (!confirm(`Sahkan pembayaran RM ${amountFormatted} untuk ${item.namaPesilat}?`)) return;

      const btn = document.getElementById(`btn-approve-${index}`);
      if (btn) {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Menjana...</span>`;
        btn.disabled = true;
      }

      try {
        const payload = {
          action: "approvePayment",
          pRow: item.pRow,
          bulan: item.bulan,
          jumlah: item.jumlah,
          namaPesilat: item.namaPesilat,
          namaPembayar: item.namaPembayar,
          gelanggang: item.gelanggang
        };

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.status === "SUCCESS") {
          let alertMsg = "Bayaran berjaya disahkan & Resit PDF telah dijana!";
          if (result.resitUrl) alertMsg += "\n\nPautan Resit: " + result.resitUrl;
          alert(alertMsg);
          loadPendingData();
        } else {
          alert("Gagal: " + (result.message || "Terdapat ralat semasa pengesahan."));
          if (btn) {
            btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>Sahkan</span>`;
            btn.disabled = false;
          }
        }
      } catch (err) {
        alert("Ralat sambungan ke server semasa mengesahkan bayaran!");
        if (btn) {
          btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>Sahkan</span>`;
          btn.disabled = false;
        }
      }
    }

    async function rejectPaymentByIndex(index) {
      const item = cachedPendingList[index];
      if (!item) return;

      if (!confirm(`Adakah anda pasti mahu BATALKAN / TOLAK permohonan bayaran ini untuk ${item.namaPesilat}?`)) return;

      const btn = document.getElementById(`btn-reject-${index}`);
      if (btn) {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Membatalkan...</span>`;
        btn.disabled = true;
      }

      try {
        const payload = {
          action: "rejectPayment",
          pRow: item.pRow,
          bulan: item.bulan,
          namaPesilat: item.namaPesilat,
          gelanggang: item.gelanggang
        };

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.status === "SUCCESS") {
          alert("Bayaran telah dibatalkan & rekod telah dibersihkan!");
          loadPendingData();
        } else {
          alert("Gagal membatalkan: " + (result.message || "Ralat pelayan."));
          if (btn) {
            btn.innerHTML = `<i class="fa-solid fa-xmark"></i> <span>Tolak / Batal</span>`;
            btn.disabled = false;
          }
        }
      } catch (err) {
        alert("Ralat sambungan ke server semasa membatalkan bayaran!");
        if (btn) {
          btn.innerHTML = `<i class="fa-solid fa-xmark"></i> <span>Tolak / Batal</span>`;
          btn.disabled = false;
        }
      }
    }
  </script>
</body>
</html>
