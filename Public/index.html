<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Yuran Silat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-bold mb-4 text-center text-green-800">Portal Pembayaran Yuran Silat</h2>
    
    <!-- Step 1: Login Form -->
    <div id="login-section">
      <label class="block mb-2 font-semibold">Masukkan No. Telefon / IC Ibu Bapa:</label>
      <input type="text" id="parent-id" class="w-full border p-2 rounded mb-4" placeholder="0123456789">
      <button onclick="checkStudentData()" class="w-full bg-green-700 text-white p-2 rounded font-bold">Semak Tunggakan</button>
    </div>

    <!-- Step 2: Dashboard Yuran (Hidden secara lalai) -->
    <div id="dashboard-section" class="hidden">
      <h3 id="student-info" class="font-bold text-lg border-b pb-2 mb-3"></h3>
      <p class="font-semibold mb-2">Pilih bulan yuran untuk dibayar:</p>
      
      <div id="fees-list" class="space-y-2 mb-4"></div>

      <div class="border-t pt-2 mb-4 font-bold text-lg">
        Jumlah Perlu Dibayar: RM <span id="total-amount">0.00</span>
      </div>

      <!-- Imbas QR -->
      <div class="text-center my-4 bg-gray-50 p-3 rounded border">
        <p class="text-xs text-gray-500 mb-1">Imbas QR DuitNow Bank Persatuan:</p>
        <img src="https://via.placeholder.com/150?text=QR+DuitNow" class="mx-auto w-36 h-36">
      </div>

      <button onclick="submitPayment()" class="w-full bg-blue-700 text-white p-2 rounded font-bold">Sahkan & Jana Resit</button>
    </div>

    <!-- Step 3: Keputusan Resit -->
    <div id="result-section" class="hidden text-center mt-4">
      <p class="text-green-600 font-bold mb-2">Pembayaran Berjaya!</p>
      <a id="receipt-link" href="#" target="_blank" class="inline-block bg-yellow-500 text-black px-4 py-2 rounded font-bold">Muat Turun Resit PDF</a>
    </div>
  </div>

  <script>
    // MASUKKAN WEB APP URL GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-VvDCxUx2eB3Ob4qmv18ZKTg5mWvBwJTDGtm-0VNgg9oj7tCZ1Bo3zdyIv_i5oRKE/exec"; 

    let currentStudentData = null;
    let selectedMonths = [];
    const feeRate = 30; // RM30 sebulan

    async function checkStudentData() {
      const ic = document.getElementById('parent-id').value;
      if(!ic) return alert('Sila masukkan No ID');

      const res = await fetch(`${SCRIPT_URL}?ic=${ic}`);
      const data = await res.json();

      if(data.length === 0) return alert('Data tidak dijumpai.');

      currentStudentData = data[0]; // Ambil data anak pertama
      
      document.getElementById('student-info').innerText = `${currentStudentData.namaAnak} (${currentStudentData.gelanggang})`;
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');

      let feesHtml = '';
      if(!currentStudentData.jan) feesHtml += `<label class="block"><input type="checkbox" value="Januari" onchange="calculateTotal(this)"> Yuran Januari (RM30)</label>`;
      if(!currentStudentData.feb) feesHtml += `<label class="block"><input type="checkbox" value="Februari" onchange="calculateTotal(this)"> Yuran Februari (RM30)</label>`;
      if(!currentStudentData.mac) feesHtml += `<label class="block"><input type="checkbox" value="Mac" onchange="calculateTotal(this)"> Yuran Mac (RM30)</label>`;

      if(feesHtml === '') feesHtml = '<p class="text-green-600 font-semibold">Tiada tunggakan yuran!</p>';
      
      document.getElementById('fees-list').innerHTML = feesHtml;
    }

    function calculateTotal(checkbox) {
      if(checkbox.checked) {
        selectedMonths.push(checkbox.value);
      } else {
        selectedMonths = selectedMonths.filter(m => m !== checkbox.value);
      }
      document.getElementById('total-amount').innerText = (selectedMonths.length * feeRate).toFixed(2);
    }

    async function submitPayment() {
      if(selectedMonths.length === 0) return alert('Sila pilih sekurang-kurangnya 1 bulan yuran!');

      alert('Sedang memproses pembayaran & menjana resit...');

      const payload = {
        row: currentStudentData.row,
        bulanList: selectedMonths,
        totalAmount: selectedMonths.length * feeRate
      };

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      const result = await res.json();

      if(result.status === "SUCCESS") {
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('receipt-link').href = result.resitUrl;
      } else {
        alert('Ralat: ' + result.message);
      }
    }
  </script>
</body>
</html>
